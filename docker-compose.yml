services:
  postgres-master:
    image: postgres:18.3
    container_name: hl_postgres_master
    restart: unless-stopped
    environment:
      POSTGRES_DB: social
      POSTGRES_USER: social_user
      POSTGRES_PASSWORD: social_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d
      - ./db/master/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./db/master/pg_hba.conf:/etc/postgresql/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social_user -d social"]
      interval: 5s
      timeout: 5s
      retries: 10
    command: >
      postgres
      -c config_file=/etc/postgresql/postgresql.conf
      -c hba_file=/etc/postgresql/pg_hba.conf
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1g
    networks:
      - pgcluster

  postgres-slave1:
    image: postgres:18.3
    container_name: hl_postgres_slave1
    restart: unless-stopped
    environment:
      PGPASSWORD: replicator_pass
    ports:
      - "5433:5432"
    volumes:
      - pgdata_slave1:/var/lib/postgresql/data
      - ./db/slave/postgresql.conf:/etc/postgresql/postgresql.conf
    depends_on:
      postgres-master:
        condition: service_healthy
    entrypoint: /bin/bash
    command: >
      -c "
        set -e
        if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
          echo 'Waiting for master to accept replication connections...'
          until pg_isready -h postgres-master -p 5432 -U replicator -d social; do
            sleep 2
          done
          sleep 3
          echo 'Creating base backup from master...'
          chown -R postgres:postgres /var/lib/postgresql/data
          gosu postgres pg_basebackup -h postgres-master -U replicator -D /var/lib/postgresql/data -Fp -Xs -P -R           -S slave1_slot
          chmod 700 /var/lib/postgresql/data
        fi
        exec gosu postgres postgres -D /var/lib/postgresql/data -c config_file=/etc/postgresql/postgresql.conf
      "
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1g
    networks:
      - pgcluster

  postgres-slave2:
    image: postgres:18.3
    container_name: hl_postgres_slave2
    restart: unless-stopped
    environment:
      PGPASSWORD: replicator_pass
    ports:
      - "5434:5432"
    volumes:
      - pgdata_slave2:/var/lib/postgresql/data
      - ./db/slave/postgresql.conf:/etc/postgresql/postgresql.conf
    depends_on:
      postgres-master:
        condition: service_healthy
    entrypoint: /bin/bash
    command: >
      -c "
        set -e
        if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
          echo 'Waiting for master to accept replication connections...'
          until pg_isready -h postgres-master -p 5432 -U replicator -d social; do
            sleep 2
          done
          sleep 3
          echo 'Creating base backup from master...'
          chown -R postgres:postgres /var/lib/postgresql/data
          gosu postgres pg_basebackup -h postgres-master -U replicator -D /var/lib/postgresql/data -Fp -Xs -P -R           -S slave2_slot
          chmod 700 /var/lib/postgresql/data
        fi
        exec gosu postgres postgres -D /var/lib/postgresql/data -c config_file=/etc/postgresql/postgresql.conf
      "
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1g
    networks:
      - pgcluster

  redis:
    image: redis:7-alpine
    container_name: hl_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - pgcluster

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: hl_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - pgcluster

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: hl_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - pgcluster

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: hl_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - pgcluster

  # ---------------------------------------------------------------------------
  # Citus coordinator + workers (dialog subsystem)
  # ---------------------------------------------------------------------------
  citus-coordinator:
    image: citusdata/citus:14.0.0
    container_name: hl_citus_coordinator
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: social_dialogs
      POSTGRES_USER: citus_user
      POSTGRES_PASSWORD: citus_pass
      PGDATA: /var/lib/postgresql/data
    volumes:
      - citus_coordinator_data:/var/lib/postgresql/data
      - ./db/citus/init:/docker-entrypoint-initdb.d
      - ./db/citus/pg_hba.conf:/etc/citus/pg_hba.conf
    command: postgres -c hba_file=/etc/citus/pg_hba.conf -c wal_level=logical
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citus_user -d social_dialogs"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - pgcluster

  citus-worker1:
    image: citusdata/citus:14.0.0
    container_name: hl_citus_worker1
    restart: unless-stopped
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: social_dialogs
      POSTGRES_USER: citus_user
      POSTGRES_PASSWORD: citus_pass
      PGDATA: /var/lib/postgresql/data
    volumes:
      - citus_worker1_data:/var/lib/postgresql/data
      - ./db/citus/pg_hba.conf:/etc/citus/pg_hba.conf
    command: postgres -c hba_file=/etc/citus/pg_hba.conf -c wal_level=logical
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citus_user -d social_dialogs"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - pgcluster

  citus-worker2:
    image: citusdata/citus:14.0.0
    container_name: hl_citus_worker2
    restart: unless-stopped
    ports:
      - "5437:5432"
    environment:
      POSTGRES_DB: social_dialogs
      POSTGRES_USER: citus_user
      POSTGRES_PASSWORD: citus_pass
      PGDATA: /var/lib/postgresql/data
    volumes:
      - citus_worker2_data:/var/lib/postgresql/data
      - ./db/citus/pg_hba.conf:/etc/citus/pg_hba.conf
    command: postgres -c hba_file=/etc/citus/pg_hba.conf -c wal_level=logical
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citus_user -d social_dialogs"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - pgcluster

  citus-worker3:
    image: citusdata/citus:14.0.0
    container_name: hl_citus_worker3
    restart: unless-stopped
    ports:
      - "5438:5432"
    environment:
      POSTGRES_DB: social_dialogs
      POSTGRES_USER: citus_user
      POSTGRES_PASSWORD: citus_pass
      PGDATA: /var/lib/postgresql/data
    volumes:
      - citus_worker3_data:/var/lib/postgresql/data
