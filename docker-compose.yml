    command: postgres -c hba_file=/etc/citus/pg_hba.conf -c wal_level=logical
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citus_user -d social_dialogs"]
      interval: 5s
      timeout: 5s
      retries: 15
