  # Registers workers with the coordinator after all nodes are healthy
  citus-setup:
    image: citusdata/citus:14.0.0
    container_name: hl_citus_setup
    restart: "no"
    depends_on:
      citus-coordinator:
        condition: service_healthy
      citus-worker1:
        condition: service_healthy
      citus-worker2:
        condition: service_healthy
      citus-worker3:
        condition: service_healthy
    environment:
      PGPASSWORD: citus_pass
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        echo "Registering Citus workers with coordinator..."
        psql -h citus-coordinator -U citus_user -d social_dialogs -c \
          "SELECT citus_set_coordinator_host('citus-coordinator', 5432);"
        psql -h citus-coordinator -U citus_user -d social_dialogs -c \
          "SELECT * FROM citus_add_node('citus-worker1', 5432);"
        psql -h citus-coordinator -U citus_user -d social_dialogs -c \
          "SELECT * FROM citus_add_node('citus-worker2', 5432);"
        psql -h citus-coordinator -U citus_user -d social_dialogs -c \
          "SELECT * FROM citus_add_node('citus-worker3', 5432);"
        echo "Workers registered. Distributing table across workers..."
        psql -h citus-coordinator -U citus_user -d social_dialogs -c \
          "SELECT create_distributed_table('messages', 'conversation_id', shard_count => 32);"
        psql -h citus-coordinator -U citus_user -d social_dialogs -c \
          "CREATE INDEX IF NOT EXISTS idx_messages_conv_time ON messages (conversation_id, created_at DESC);"
        echo "Shards distributed and indexes created successfully."
    networks:
      - pgcluster

  # ---------------------------------------------------------------------------
  # Инфраструктура Traefik
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3.0
    container_name: hl_traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80" # Тестировать теперь можно через http://localhost/...
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - pgcluster

  # ---------------------------------------------------------------------------
  # Ваши веб-сервисы с поддержкой роутинга и авторизации
  # ---------------------------------------------------------------------------
  app:
    build: .
    container_name: hl_app
    restart: unless-stopped
    # ports:
    #   - "8080:8080"
    environment:
      DB_HOST: postgres-master
      DB_PORT: 5432
      DB_NAME: social
      DB_USER: social_user
      DB_PASSWORD: social_pass
      DB_REPLICA_HOSTS: "postgres-slave1:5432,postgres-slave2:5432"
      JWT_SECRET: change-me-secret
      SERVER_ADDR: :8080
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:29092
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      LOG_LEVEL: debug
      RECALC_CELEBRITY_ON_START: false
      CELEBRITY_THRESHOLD: 10000
      DIALOG_SVC_ADDR: dialog_svc:8080
      DIALOG_SVC_PROTOCOL: http
      DIALOG_SEND_ENDPOINT_TEMPLATE: "dialog/%s/send"
      DIALOG_LIST_ENDPOINT_TEMPLATE: "dialog/%s/list"
    depends_on:
      postgres-master:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
      rabbitmq:
        condition: service_started
    labels:
      - "traefik.enable=true"
      # Монолит обрабатывает всё, кроме путей диалогов версии 2
      - "traefik.http.routers.monolith.rule=Host(`localhost`)"
      - "traefik.http.routers.monolith.entrypoints=web"
      - "traefik.http.services.monolith.loadbalancer.server.port=8080"

      # Указываем Traefik, через какую конкретно сеть ходить в этот контейнер:
      - "traefik.docker.network=pgcluster"
    networks:
      - pgcluster

  dialog_svc:
    image: mblkuta/dialog-svc:0.2.1
    container_name: dialogsvc
    restart: unless-stopped
    # ports:
    #   - "8081:8080"
    environment:
      # Citus coordinator for the dialog subsystem
      CITUS_HOST: citus-coordinator
      CITUS_PORT: 5432
      CITUS_DB: social_dialogs
      CITUS_USER: citus_user
      CITUS_PASSWORD: citus_pass
      SERVER_ADDR: :8080
    depends_on:
      citus-setup:
        condition: service_started
      app:
        condition: service_started
    labels:
      - "traefik.enable=true"
      # Перехватываем роуты диалогов v2 (PathPrefix с литералом /v2/dialog/ —
      # {toUserId} в Traefik v3 не является шаблоном пути, поэтому ловим всё под /v2/dialog/)
      - "traefik.http.routers.dialogs.rule=Host(`localhost`) && PathPrefix(`/v2/dialog/`)"
      - "traefik.http.routers.dialogs.entrypoints=web"
      - "traefik.http.routers.dialogs.priority=100" # Приоритет выше монолита

      # Указываем Traefik, через какую конкретно сеть ходить в этот контейнер:
      - "traefik.docker.network=pgcluster"

      # Мидлварь для проверки авторизации через эндпоинт монолита.
      # Объявляем её здесь же, на контейнере dialog_svc, чтобы Traefik гарантированно
      # регистрировал её одновременно с роутером dialogs (избегаем race-condition,
      # когда контейнер app ещё не поднялся / рестартится).
      - "traefik.http.middlewares.monolith-auth.forwardauth.address=http://app:8080/auth/verify"
      - "traefik.http.middlewares.monolith-auth.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.monolith-auth.forwardauth.authResponseHeaders=X-User-ID"

      # Мидлварь для удаления префикса /v2
      - "traefik.http.middlewares.strip-v2.stripprefix.prefixes=/v2"

      # Применяем обе мидлвари к роутеру диалогов
      - "traefik.http.routers.dialogs.middlewares=monolith-auth,strip-v2"
      - "traefik.http.services.dialogs.loadbalancer.server.port=8080"
    networks:
      - pgcluster

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - pgcluster

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    networks:
      - pgcluster

volumes:
  pgdata:
    name: highload-homework3_pgdata
  pgdata_slave1:
    name: highload-homework3_pgdata_slave1
  pgdata_slave2:
    name: highload-homework3_pgdata_slave2
  citus_coordinator_data:
    name: highload-homework3_citus_coordinator
  citus_worker1_data:
    name: highload-homework3_citus_worker1
  citus_worker2_data:
    name: highload-homework3_citus_worker2
  citus_worker3_data:
    name: highload-homework3_citus_worker3
  # citus_worker4_data:
  #   name: highload-homework3_citus_worker4


networks:
  pgcluster:
    driver: bridge